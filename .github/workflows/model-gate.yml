name: Model gate

# Scores the checkpoint that settings.py points at on the small eval sets and
# fails the PR if it regresses past evals/gate_thresholds.json. Runs when a
# checkpoint, the model settings, or the eval tooling changes.
on:
  pull_request:
    paths:
      - "src/mBERT/training/model-training/*.pth"
      - "src/api_interface/config/settings.py"
      - "evals/**"
      - ".github/workflows/model-gate.yml"
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Find the default checkpoint
        id: ckpt
        run: |
          p=$(grep -o 'mBERT/training/model-training/mbert_ots_model_[0-9.]*\.pth' src/api_interface/config/settings.py | head -1)
          echo "path=src/$p" >> "$GITHUB_OUTPUT"
          echo "oid=$(git show HEAD:src/$p | grep oid | cut -d: -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache the checkpoint and vocab
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.ckpt.outputs.path }}
            evals/assets/bert-base-multilingual-cased-vocab.txt
          key: lfs-${{ steps.ckpt.outputs.oid }}

      - name: Pull the checkpoint from LFS
        if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs pull --include "${{ steps.ckpt.outputs.path }},evals/assets/bert-base-multilingual-cased-vocab.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU torch and transformers
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Score and gate
        run: python evals/gate.py --model "${{ steps.ckpt.outputs.path }}"
