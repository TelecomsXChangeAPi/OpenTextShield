name: Release image

# Builds the Docker image for linux/amd64 and linux/arm64 and pushes it to
# Docker Hub. Refuses to finish unless the pushed manifest lists both
# platforms, so a single-architecture image can never reach the public host
# again. Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 2.9)"
        required: true
      latest:
        description: "Also move the latest tag"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Work out the tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then tag="${GITHUB_REF_NAME#v}"; latest=true; else tag="${{ inputs.tag }}"; latest="${{ inputs.latest }}"; fi
          t="telecomsxchange/opentextshield:$tag"
          [ "$latest" = "true" ] && t="$t,telecomsxchange/opentextshield:latest"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "list=$t" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both platforms are in the manifest
        run: |
          m=$(docker buildx imagetools inspect "telecomsxchange/opentextshield:${{ steps.tags.outputs.tag }}")
          echo "$m" | grep -q "linux/amd64" || { echo "amd64 missing"; exit 1; }
          echo "$m" | grep -q "linux/arm64" || { echo "arm64 missing"; exit 1; }
          echo "manifest ok: amd64 + arm64"
